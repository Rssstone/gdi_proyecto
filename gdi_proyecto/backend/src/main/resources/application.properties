spring.application.name=citas

# Base de datos (en Docker se sobrescriben con variables de entorno SPRING_DATASOURCE_*)
spring.datasource.url=jdbc:mysql://localhost:3306/gdi_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Horario de atención de Clínica Imagen. Un día sin horario se considera cerrado (domingo).
clinica.zona-horaria=America/Mexico_City
clinica.intervalo-minutos=30
clinica.horarios.MONDAY.apertura=09:00
clinica.horarios.MONDAY.cierre=19:00
clinica.horarios.TUESDAY.apertura=09:00
clinica.horarios.TUESDAY.cierre=19:00
clinica.horarios.WEDNESDAY.apertura=09:00
clinica.horarios.WEDNESDAY.cierre=19:00
clinica.horarios.THURSDAY.apertura=09:00
clinica.horarios.THURSDAY.cierre=19:00
clinica.horarios.FRIDAY.apertura=09:00
clinica.horarios.FRIDAY.cierre=19:00
clinica.horarios.SATURDAY.apertura=09:00
clinica.horarios.SATURDAY.cierre=14:00
